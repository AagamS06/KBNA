name: Daily lottery refresh (primary)

# PRIMARY. Refreshes web-design/data/lottery.json from the official operator
# feed once per real Australia/Sydney day, then commits ONLY that file so
# Vercel auto-deploys the change to the live site.
#
# A second workflow, `lottery-safety-net.yml`, fires ~30 minutes later and
# runs the identical script; the script's Sydney-date gate means the safety
# net is a fast no-op on a normal day and only does real work when this
# primary fails (network hiccup, API 5xx, etc.).
#
# Refreshes web-design/data/lottery.json from the official operator feed once
# per real Australia/Sydney day, then commits ONLY that file.
#
# WHY TWO CRONS, AND WHY 10PM. GitHub Actions cron is UTC-only and has no DST,
# so a fixed UTC time lands at a different Sydney clock time across the year.
# We fire at 10pm Sydney the same day as the draw — 90 minutes after the
# operator's 8:30pm draws, so the result is finalised on the feed by the
# time we ask for it:
#   - AEDT (UTC+11): Sydney 22:00 == 11:00 UTC the same day
#   - AEST (UTC+10): Sydney 22:00 == 12:00 UTC the same day
# Running at both 11:00 and 12:00 UTC guarantees a fire at 10pm Sydney all year
# round. The script gates on the real Australia/Sydney date (it stamps
# `_gateSydneyDate` on the file it writes and skips the network entirely if
# that already equals today's Sydney date), so the second daily fire — plus
# the safety-net workflow — is a fast no-op on a normal day.
#
# COMPLIANCE. The script publishes only facts (winning numbers, draw number,
# advertised jackpot) and NEVER fetches or stores a poster or trademarked logo.
# It stamps `verified: true` only on real fetched data; the renderer keeps the
# panel hidden otherwise. It fails soft: on any error the last good file is
# left untouched, so a broken/empty lottery.json is never committed.

on:
  schedule:
    # Mon-Sat only (skip Sunday night Sydney per owner request). Cron
    # weekday field: 0=Sun, 1=Mon .. 6=Sat, so 1-6 = Mon-Sat. Because 10pm
    # Sydney falls on the same UTC calendar day as the Sydney day at both
    # 11:00 and 12:00 UTC, "1-6" in UTC cron also excludes Sunday Sydney.
    - cron: "0 11 * * 1-6"  # 10pm Sydney during AEDT (UTC+11) — same day
    - cron: "0 12 * * 1-6"  # 10pm Sydney during AEST (UTC+10) — same day
  workflow_dispatch:         # manual "Run workflow" button — fires any day

# Least privilege: the job only needs to push the one data file back.
permissions:
  contents: write

# Never let two backup runs race each other.
concurrency:
  group: lottery-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"   # built-in fetch + Intl; no dependencies to install

      - name: Refresh lottery.json
        working-directory: web-design
        run: node tools/update-lottery.mjs

      - name: Commit and push if changed
        run: |
          set -e
          git add web-design/data/lottery.json
          if git diff --cached --quiet; then
            echo "No change to lottery.json — nothing to commit (already refreshed for today's Sydney date)."
            exit 0
          fi
          # Commit as the repo owner so Vercel recognises the author and
          # actually deploys the push (an unrecognised email — e.g. a made-up
          # "automation@…" — lands on GitHub fine but Vercel's Hobby-tier
          # git-author check skips the build, and the fresh lottery.json
          # never reaches the live site).
          git config user.name  "AShah-01"
          git config user.email "aagamshah250506@gmail.com"
          # Do NOT include [skip ci] here — Vercel treats it as an
          # opt-out signal and won't redeploy, so the fresh lottery.json
          # sits on GitHub without reaching the live site. The workflow
          # itself is not push-triggered (schedule + manual only), so
          # there's no CI loop to worry about.
          git commit -m "chore(lottery): refresh daily draw"

          # Guard against a race with the Claude Code cloud routine landing a
          # commit moments earlier: retry the push after rebasing onto
          # whatever's new upstream, rather than just failing.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — pulling and rebasing, then retrying..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::Push failed after retries."
          exit 1
