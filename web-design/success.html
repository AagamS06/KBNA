<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Security headers (also set at the edge via _headers; meta covers static hosts like GitHub Pages) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://api.openverse.org; manifest-src 'self'; worker-src 'self'">

<meta name="description" content="Thanks for your order at Knightsbridge Newsagency — we'll have it ready to collect in store at Castle Hill NSW.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.knightsbridgenews.com.au/success.html">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">

<!-- Icons & PWA -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="application-name" content="Knightsbridge Newsagency">
<meta name="apple-mobile-web-app-title" content="Knightsbridge">

<!-- Fonts (progressive enhancement; the CSS falls back to system fonts offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

<link rel="stylesheet" href="style.css">
</head>
